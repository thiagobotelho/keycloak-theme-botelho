name: Validar fontes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validar shell, metadados e JavaScript
        run: |
          command -v node
          bash scripts/validate.sh
      - name: Compilar e conferir conteúdo do JAR
        run: |
          mvn --batch-mode package
          jar tf target/rhbk-theme-botelho-*.jar | grep -q META-INF/keycloak-themes.json
